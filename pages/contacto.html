        <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" / >
        <link rel="stylesheet" href="../styles.css">
    </head>

<body>

    <header class="header">
        <a href="../index.html">
            <img src="../img/oidoloco1.png" alt="Logo de la tienda">
        </a>
        <nav class="navegacion">

                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
            <section>
                <form action="https://formspree.io/f/xanyzboq" method="POST">
                    <span>DEJA UN MENSAJE</span>
                    <h2>Queremos saber de ti</h2>

                    <div>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>

                    <div>
                        <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                    </div>

                    <div>
                        <input type="text" id="asunto" name="asunto" placeholder="Asunto" required>
                    </div>

                    <div>
                        <textarea id="mensaje" name="mensaje" placeholder="Tu mensaje" required></textarea>
                    </div>

                    <button type="submit" class="btn-principal">Enviar</button>
                </form>
            </section>
        </main>
